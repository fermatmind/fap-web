name: Deploy Web Production

on:
  workflow_run:
    workflows: ["Deploy Web Staging"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Exact merged main commit SHA to deploy. Manual dispatch may pin an older main ancestor."
        required: true
        type: string
      manual_risk_approval:
        description: "APPROVE_RISKY_FAP_WEB_PRODUCTION_DEPLOY:<40-character deploy SHA>"
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: fap-web-production-mutation
  cancel-in-progress: false

jobs:
  policy-guard:
    name: Production auto-deploy policy guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    outputs:
      auto_deploy_allowed: ${{ steps.evaluate.outputs.auto_deploy_allowed }}
      deploy_sha: ${{ steps.evaluate.outputs.deploy_sha }}
      associated_pr: ${{ steps.evaluate.outputs.associated_pr }}
      authorization_mode: ${{ steps.evaluate.outputs.authorization_mode }}
    steps:
      - name: Evaluate production auto-deploy policy
        id: evaluate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MANUAL_RISK_APPROVAL: ${{ github.event.inputs.manual_risk_approval }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const isManualDispatch = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
            core.setOutput('authorization_mode', 'denied');
            const deploySha = process.env.GITHUB_EVENT_NAME === 'workflow_run'
              ? process.env.WORKFLOW_RUN_HEAD_SHA
              : (context.payload.inputs?.deploy_sha || '');

            if (isManualDispatch && !deploySha) {
              core.setOutput('auto_deploy_allowed', 'false');
              core.setFailed('Manual production deploy failed closed: deploy_sha is required.');
              return;
            }

            if (!deploySha || !/^[0-9a-f]{40}$/.test(deploySha)) {
              core.setOutput('auto_deploy_allowed', 'false');
              core.setFailed('Production auto-deploy policy failed closed: deploy SHA must be a 40-character lowercase hex commit SHA.');
              return;
            }

            const expectedManualApproval = `APPROVE_RISKY_FAP_WEB_PRODUCTION_DEPLOY:${deploySha}`;
            if (isManualDispatch && process.env.MANUAL_RISK_APPROVAL !== expectedManualApproval) {
              core.setOutput('auto_deploy_allowed', 'false');
              core.setFailed('Manual production deploy failed closed: manual_risk_approval must exactly match the SHA-bound approval text.');
              return;
            }

            core.setOutput('deploy_sha', deploySha);

            const { owner, repo } = context.repo;
            try {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const latestMainSha = main.data.commit.sha;
              if (isManualDispatch) {
                const mainMembership = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${deploySha}...${latestMainSha}`,
                  per_page: 1,
                });
                const deployShaIsOnMain = (
                  mainMembership.data.status === 'identical' ||
                  (
                    mainMembership.data.status === 'ahead' &&
                    mainMembership.data.behind_by === 0
                  )
                );
                if (!deployShaIsOnMain) {
                  core.setFailed(
                    `Manual production deploy failed closed: deploy SHA ${deploySha} is not contained in main ${latestMainSha}.`,
                  );
                  return;
                }
                core.info(`Manual deploy target ${deploySha} is contained in main ${latestMainSha}.`);
              } else if (deploySha !== latestMainSha) {
                core.setFailed(
                  `Production auto-deploy policy failed closed: deploy SHA ${deploySha} is not latest main ${latestMainSha}.`,
                );
                return;
              }

              const requiredCheckNames = [
                'build',
                'contracts',
                'verify-big5-contract-freeze',
                'verify-enneagram-contract-freeze',
              ];
              const requiredCheckPollIntervalMs = 15_000;
              const requiredCheckWaitTimeoutMs = 12 * 60 * 1_000;
              const requiredCheckDeadline = Date.now() + requiredCheckWaitTimeoutMs;
              while (true) {
                const checkRuns = await github.paginate(
                  github.rest.checks.listForRef,
                  { owner, repo, ref: deploySha, per_page: 100 },
                );
                const newestRequiredChecks = new Map();
                for (const run of checkRuns) {
                  if (!requiredCheckNames.includes(run?.name)) continue;
                  const current = newestRequiredChecks.get(run.name);
                  if (!current || Number(run.id) > Number(current.id)) {
                    newestRequiredChecks.set(run.name, run);
                  }
                }

                const pendingRequiredChecks = [];
                const failedRequiredChecks = [];
                for (const name of requiredCheckNames) {
                  const run = newestRequiredChecks.get(name);
                  if (!run || run.status !== 'completed') {
                    pendingRequiredChecks.push(name);
                  } else if (run.conclusion !== 'success') {
                    failedRequiredChecks.push(`${name}:${run.conclusion || 'missing'}`);
                  }
                }

                if (failedRequiredChecks.length > 0) {
                  core.setFailed(
                    `Production deploy failed closed: required checks failed: ${failedRequiredChecks.join(', ')}.`,
                  );
                  return;
                }
                if (pendingRequiredChecks.length === 0) break;
                if (Date.now() >= requiredCheckDeadline) {
                  core.setFailed(
                    `Production deploy failed closed: timed out waiting for required checks: ${pendingRequiredChecks.join(', ')}.`,
                  );
                  return;
                }

                core.info(`Waiting for required checks: ${pendingRequiredChecks.join(', ')}.`);
                await new Promise((resolve) => setTimeout(resolve, requiredCheckPollIntervalMs));
              }

              const refreshedMain = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const refreshedMainSha = refreshedMain.data.commit.sha;
              if (isManualDispatch) {
                const refreshedMembership = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${deploySha}...${refreshedMainSha}`,
                  per_page: 1,
                });
                const deployShaStillOnMain = (
                  refreshedMembership.data.status === 'identical' ||
                  (
                    refreshedMembership.data.status === 'ahead' &&
                    refreshedMembership.data.behind_by === 0
                  )
                );
                if (!deployShaStillOnMain) {
                  core.setFailed(
                    `Manual production deploy failed closed: deploy SHA ${deploySha} is no longer contained in main ${refreshedMainSha}.`,
                  );
                  return;
                }
              } else if (deploySha !== refreshedMainSha) {
                core.setOutput('auto_deploy_allowed', 'false');
                core.notice(
                  `Skipping automatic production deploy because ${deploySha} was superseded by main ${refreshedMainSha}.`,
                );
                return;
              }

              const deployments = await github.paginate(
                github.rest.repos.listDeployments,
                { owner, repo, environment: 'production', per_page: 100 },
              );
              let baselineSha = '';
              for (const deployment of deployments) {
                const candidateSha = String(deployment.sha || '');
                if (!/^[0-9a-f]{40}$/.test(candidateSha) || candidateSha === deploySha) {
                  continue;
                }

                const statuses = await github.paginate(
                  github.rest.repos.listDeploymentStatuses,
                  { owner, repo, deployment_id: deployment.id, per_page: 100 },
                );
                if (statuses.some((status) => status.state === 'success')) {
                  baselineSha = candidateSha;
                  break;
                }
              }

              if (!baselineSha) {
                core.setFailed('Production auto-deploy policy failed closed: no previous successful production deployment baseline was found.');
                return;
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${baselineSha}...${deploySha}`,
                per_page: 100,
              });
              if (comparison.data.status !== 'ahead' || comparison.data.behind_by !== 0) {
                core.setFailed(
                  `Production auto-deploy policy failed closed: production baseline ${baselineSha} is not an ancestor of ${deploySha}.`,
                );
                return;
              }

              const commits = await github.paginate(
                github.rest.repos.compareCommitsWithBasehead,
                { owner, repo, basehead: `${baselineSha}...${deploySha}`, per_page: 100 },
                (response) => response.data.commits,
              );
              if (commits.length === 0 || commits.at(-1)?.sha !== deploySha) {
                core.setFailed('Production auto-deploy policy failed closed: deployment change range is empty or incomplete.');
                return;
              }

              const pullsByNumber = new Map();
              const directMainCommits = [];
              for (const commit of commits) {
                const associatedPulls = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: commit.sha, per_page: 100 },
                );
                const mergedMainPulls = [
                  ...new Map(
                    associatedPulls
                      .filter((pull) => pull.base?.ref === 'main' && pull.merged_at)
                      .map((pull) => [pull.number, pull]),
                  ).values(),
                ];
                if (mergedMainPulls.length > 1) {
                  core.setFailed(
                    `Production auto-deploy policy failed closed: expected exactly one merged main PR for range commit ${commit.sha}, found ${mergedMainPulls.length}.`,
                  );
                  return;
                }
                if (mergedMainPulls.length === 0) {
                  if (!isManualDispatch) {
                    core.setFailed(
                      `Production auto-deploy policy failed closed: expected exactly one merged main PR for range commit ${commit.sha}, found 0.`,
                    );
                    return;
                  }
                  directMainCommits.push(commit.sha);
                  continue;
                }
                pullsByNumber.set(mergedMainPulls[0].number, mergedMainPulls[0]);
              }

              const pulls = [...pullsByNumber.values()];
              core.setOutput('associated_pr', pulls.map((pull) => pull.number).join(','));
              core.info(`Production deploy range: ${baselineSha}...${deploySha}`);
              core.info(`Associated PRs: ${pulls.map((pull) => `#${pull.number} ${pull.title}`).join('; ')}`);

              const normalizeLabelName = (label) => (
                typeof label === 'string'
                  ? label.toLowerCase()
                  : String(label?.name || '').toLowerCase()
              );
              const labels = pulls
                .flatMap((pull) => (pull.labels || []).map(normalizeLabelName))
                .filter(Boolean);
            const riskyLabelPatterns = [
              /(^|[-_: ])no[-_: ]?auto[-_: ]?production($|[-_: ])/,
              /(^|[-_: ])manual[-_: ]?production($|[-_: ])/,
              /(^|[-_: ])production[-_: ]?manual($|[-_: ])/,
              /(^|[-_: ])requires[-_: ]?production[-_: ]?approval($|[-_: ])/,
              /(^|[-_: ])cms($|[-_: ])/,
              /(^|[-_: ])search($|[-_: ])/,
              /(^|[-_: ])sitemap($|[-_: ])/,
              /(^|[-_: ])llms($|[-_: ])/,
              /(^|[-_: ])content[-_: ]?release($|[-_: ])/,
              /(^|[-_: ])deploy($|[-_: ])/,
              /(^|[-_: ])secret(s)?($|[-_: ])/,
            ];
              const riskyLabels = [...new Set(
                labels.filter((label) => riskyLabelPatterns.some((pattern) => pattern.test(label))),
              )];

              const files = [];
              for (const pull of pulls) {
                files.push(...await github.paginate(
                  github.rest.pulls.listFiles,
                  { owner, repo, pull_number: pull.number, per_page: 100 },
                ));
              }
            const riskyPathPatterns = [
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^deploy\//,
              /^docs\/deploy\//,
              /^scripts\/[^/]*deploy/i,
              /^scripts\/.*\/[^/]*deploy/i,
              /^scripts\/deploy_/i,
              /^scripts\/release_/i,
              /^scripts\/seo\//,
              /^lib\/seo\//,
              /^app\/sitemap\.xml\//,
              /^app\/llms\.txt\//,
              /^app\/llms-full\.txt\//,
              /^app\/api\/content-release\//,
              /^public\/sitemap\.xml$/,
              /^llms\.txt$/,
              /^llms-full\.txt$/,
              /(^|\/)\.env($|\.|-)/,
              /(^|\/).*secret.*$/i,
            ];
              const riskyFiles = [...new Set(
                files
                  .map((file) => file.filename)
                  .filter((filename) => riskyPathPatterns.some((pattern) => pattern.test(filename))),
              )];

              if (directMainCommits.length > 0 || riskyLabels.length > 0 || riskyFiles.length > 0) {
                if (!isManualDispatch) {
                  core.setOutput('auto_deploy_allowed', 'false');
                  core.notice([
                    'Production auto-deploy blocked by policy.',
                    riskyLabels.length > 0 ? `Risk labels: ${riskyLabels.join(', ')}` : 'Risk labels: none',
                    riskyFiles.length > 0 ? `Risk files: ${riskyFiles.join(', ')}` : 'Risk files: none',
                    'Risky production revisions require SHA-bound workflow_dispatch authorization and protected production Environment approval.',
                  ].join('\n'));
                  return;
                }

                core.warning([
                  'Authorized manual risky production revision.',
                  directMainCommits.length > 0
                    ? `Direct main commits covered by exact SHA approval: ${directMainCommits.length}`
                    : 'Direct main commits: none',
                  riskyLabels.length > 0 ? `Risk labels: ${riskyLabels.join(', ')}` : 'Risk labels: none',
                  riskyFiles.length > 0 ? `Risk files: ${riskyFiles.join(', ')}` : 'Risk files: none',
                  'The deploy job remains gated by the protected production GitHub Environment.',
                ].join('\n'));
                core.setOutput('auto_deploy_allowed', 'true');
                core.setOutput('authorization_mode', 'manual_sha_bound_recovery');
                return;
              }

              core.setOutput('auto_deploy_allowed', 'true');
              core.setOutput(
                'authorization_mode',
                isManualDispatch ? 'manual_sha_bound_recovery' : 'automatic_benign',
              );
              core.info('Production auto-deploy policy passed for the complete verified main change range.');
            } catch (error) {
              core.setOutput('auto_deploy_allowed', 'false');
              core.setFailed(`Production auto-deploy policy failed closed after a GitHub API error: ${error.message}`);
            }

  deploy-production:
    name: Deploy fap-web production Node1
    needs: policy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >-
      ${{
        needs.policy-guard.outputs.auto_deploy_allowed == 'true' &&
        (
          needs.policy-guard.outputs.authorization_mode == 'automatic_benign' ||
          needs.policy-guard.outputs.authorization_mode == 'manual_sha_bound_recovery'
        )
      }}
    concurrency:
      group: deploy-web-production-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: production
      # Solo-operator decision: the repository owner may approve this protected
      # environment, but only after the SHA-bound policy guard has succeeded.
    env:
      DEPLOY_HOST: ${{ secrets.WEB_NODE1_DEPLOY_HOST || vars.WEB_NODE1_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.WEB_NODE1_DEPLOY_USER || vars.WEB_NODE1_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.WEB_NODE1_DEPLOY_PORT || vars.WEB_NODE1_DEPLOY_PORT }}
      APP_DIR: ${{ secrets.WEB_NODE1_APP_DIR || vars.WEB_NODE1_APP_DIR }}
      APP_NAME: ${{ secrets.WEB_NODE1_APP_NAME || vars.WEB_NODE1_APP_NAME }}
      APP_PORT: ${{ secrets.WEB_NODE1_APP_PORT || vars.WEB_NODE1_APP_PORT }}
      APP_MANAGER: ${{ secrets.WEB_NODE1_APP_MANAGER || vars.WEB_NODE1_APP_MANAGER }}
      SYSTEMD_SERVICE: ${{ secrets.WEB_NODE1_SYSTEMD_SERVICE || vars.WEB_NODE1_SYSTEMD_SERVICE }}
      PUBLIC_BASE_URL: ${{ secrets.WEB_PUBLIC_BASE_URL || vars.WEB_PUBLIC_BASE_URL }}
      CORE_PUBLIC_PATH: ${{ secrets.WEB_PRODUCTION_CORE_PUBLIC_PATH || vars.WEB_PRODUCTION_CORE_PUBLIC_PATH }}
      RUN_SITEMAP_HEALTH: ${{ secrets.WEB_PRODUCTION_RUN_SITEMAP_HEALTH || vars.WEB_PRODUCTION_RUN_SITEMAP_HEALTH }}
      AUTHORIZATION_MODE: ${{ needs.policy-guard.outputs.authorization_mode }}
      SSH_RETRY_ATTEMPTS: "3"
      SSH_RETRY_DELAY_SECONDS: "10"
      ARTIFACT_TRANSFER_ATTEMPTS: "3"
      ARTIFACT_TRANSFER_DELAY_SECONDS: "10"
      ARTIFACT_TRANSFER_IO_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.policy-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Resolve production deploy settings
        shell: bash
        env:
          POLICY_DEPLOY_SHA: ${{ needs.policy-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="$POLICY_DEPLOY_SHA"

          test -n "$DEPLOY_SHA"
          case "$AUTHORIZATION_MODE" in
            automatic_benign|manual_sha_bound_recovery) ;;
            *) echo "invalid production authorization mode" >&2; exit 1 ;;
          esac
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          : "${DEPLOY_PORT:=22}"
          : "${APP_DIR:=/opt/apps/fap-web}"
          : "${APP_NAME:=fap-web}"
          : "${APP_PORT:=3000}"
          : "${APP_MANAGER:=pm2}"
          : "${SYSTEMD_SERVICE:=fap-web.service}"
          : "${PUBLIC_BASE_URL:=https://fermatmind.com}"
          : "${CORE_PUBLIC_PATH:=/zh/personality/intj-a}"
          : "${RUN_SITEMAP_HEALTH:=1}"

          {
            echo "DEPLOY_SHA=$DEPLOY_SHA"
            echo "DEPLOY_PORT=$DEPLOY_PORT"
            echo "APP_DIR=$APP_DIR"
            echo "APP_NAME=$APP_NAME"
            echo "APP_PORT=$APP_PORT"
            echo "APP_MANAGER=$APP_MANAGER"
            echo "SYSTEMD_SERVICE=$SYSTEMD_SERVICE"
            echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL"
            echo "CORE_PUBLIC_PATH=$CORE_PUBLIC_PATH"
            echo "RUN_SITEMAP_HEALTH=$RUN_SITEMAP_HEALTH"
            echo "RUN_CMS_BASELINE_STAGING_SMOKE=0"
            echo "RUN_CONTENT_RELEASE_REVALIDATE_SMOKE=0"
          } >> "$GITHUB_ENV"

      - name: Confirm approved revision remains on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          LATEST_MAIN_SHA="$(git rev-parse origin/main)"
          echo "deploy_sha=$DEPLOY_SHA"
          echo "latest_main_sha=$LATEST_MAIN_SHA"
          if [[ "$AUTHORIZATION_MODE" == "automatic_benign" ]]; then
            test "$DEPLOY_SHA" = "$LATEST_MAIN_SHA"
          else
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          fi

      - name: Resolve exact-SHA staging success receipt
        id: staging
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TRIGGER_STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const expectedName = `fap-web-staging-receipt-${sha}`;
            const isAutomatic = process.env.GITHUB_EVENT_NAME === "workflow_run";
            let runs = [];

            if (isAutomatic) {
              const runId = Number(process.env.TRIGGER_STAGING_RUN_ID);
              if (!Number.isSafeInteger(runId) || runId <= 0) {
                core.setFailed("Automatic promotion is missing its triggering staging run ID");
                return;
              }
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              runs = [response.data];
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "deploy-staging.yml",
                branch: "main",
                head_sha: sha,
                status: "success",
                per_page: 100,
              });
              runs = response.data.workflow_runs;
            }

            for (const run of runs) {
              if (
                run.head_sha !== sha ||
                run.head_branch !== "main" ||
                run.status !== "completed" ||
                run.conclusion !== "success"
              ) {
                if (isAutomatic) {
                  core.setFailed("Triggering staging run is not a successful exact-SHA main run");
                  return;
                }
                continue;
              }

              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const matches = artifacts.data.artifacts.filter(
                (artifact) => artifact.name === expectedName && !artifact.expired,
              );
              if (matches.length !== 1) {
                if (isAutomatic) {
                  core.setFailed(`Triggering staging run must contain one ${expectedName} receipt; found ${matches.length}`);
                  return;
                }
                continue;
              }

              const receipt = matches[0];
              if (!/^sha256:[0-9a-f]{64}$/.test(String(receipt.digest || ""))) {
                core.setFailed("Staging receipt artifact is missing its immutable SHA-256 digest");
                return;
              }
              core.setOutput("run-id", String(run.id));
              core.setOutput("run-attempt", String(run.run_attempt));
              core.setOutput("receipt-artifact-id", String(receipt.id));
              core.setOutput("receipt-artifact-digest", receipt.digest);
              return;
            }
            core.setFailed(`No successful exact-SHA staging receipt was found for ${sha}`);

      - name: Verify staging success receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ steps.staging.outputs.run-id }}
          STAGING_RUN_ATTEMPT: ${{ steps.staging.outputs.run-attempt }}
          RECEIPT_ARTIFACT_ID: ${{ steps.staging.outputs.receipt-artifact-id }}
          EXPECTED_RECEIPT_ARTIFACT_DIGEST: ${{ steps.staging.outputs.receipt-artifact-digest }}
        run: |
          set -euo pipefail
          promotion_root="$RUNNER_TEMP/production-promotion-${DEPLOY_SHA}"
          receipt_zip="$promotion_root/fap-web-staging-receipt-${DEPLOY_SHA}.zip"
          receipt_name="staging-receipt-${DEPLOY_SHA}.json"
          receipt_path="$promotion_root/$receipt_name"
          mkdir -p "$promotion_root"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID/zip" \
            --output "$receipt_zip"
          actual_receipt_artifact_digest="sha256:$(sha256sum "$receipt_zip" | awk '{print $1}')"
          test "$actual_receipt_artifact_digest" = "$EXPECTED_RECEIPT_ARTIFACT_DIGEST"

          mapfile -t receipt_entries < <(unzip -Z1 "$receipt_zip")
          test "${#receipt_entries[@]}" -eq 1
          test "${receipt_entries[0]}" = "$receipt_name"
          unzip -q "$receipt_zip" -d "$promotion_root"

          receipt_json="$(node scripts/release/staging-receipt.mjs verify \
            --receipt="$receipt_path" \
            --expected-sha="$DEPLOY_SHA" \
            --expected-staging-run-id="$STAGING_RUN_ID" \
            --expected-staging-run-attempt="$STAGING_RUN_ATTEMPT")"
          RECEIPT_JSON="$receipt_json" node <<'NODE'
          const fs = require("node:fs");
          const receipt = JSON.parse(process.env.RECEIPT_JSON);
          const lines = [
            `ARTIFACT_DIGEST=${receipt.artifact_digest}`,
            `RELEASE_MANIFEST_DIGEST=${receipt.release_manifest_digest}`,
            `CI_RUN_ID=${receipt.ci_run_id}`,
            `CI_RUN_ATTEMPT=${receipt.ci_run_attempt}`,
            `STAGING_RUN_ID=${receipt.deploy_run_id}`,
            `STAGING_RUN_ATTEMPT=${receipt.deploy_run_attempt}`,
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE
          echo "PROMOTION_ROOT=$promotion_root" >> "$GITHUB_ENV"

      - name: Resolve receipt-bound CI artifact
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);
            const expectedAttempt = Number(process.env.CI_RUN_ATTEMPT);
            const sha = process.env.DEPLOY_SHA;
            const expectedName = `fap-web-standalone-${sha}`;
            if (
              !Number.isSafeInteger(runId) ||
              runId <= 0 ||
              !Number.isSafeInteger(expectedAttempt) ||
              expectedAttempt <= 0
            ) {
              core.setFailed("Receipt-bound CI run identity is invalid");
              return;
            }

            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = response.data;
            if (
              run.head_sha !== sha ||
              run.head_branch !== "main" ||
              run.event !== "push" ||
              run.status !== "completed" ||
              run.conclusion !== "success" ||
              Number(run.run_attempt) !== expectedAttempt
            ) {
              core.setFailed("Receipt-bound CI run is not the exact successful source run");
              return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = artifacts.data.artifacts.filter(
              (artifact) => artifact.name === expectedName && !artifact.expired,
            );
            if (matches.length !== 1) {
              core.setFailed(`Expected exactly one receipt-bound ${expectedName} artifact; found ${matches.length}`);
              return;
            }
            const artifact = matches[0];
            if (artifact.digest !== process.env.ARTIFACT_DIGEST) {
              core.setFailed("Receipt-bound artifact digest does not match the CI artifact digest");
              return;
            }
            core.setOutput("artifact-id", String(artifact.id));

      - name: Verify promoted artifact before SSH
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.release.outputs.artifact-id }}
          NEXT_PUBLIC_ANALYTICS_ALLOWED_HOSTS: fermatmind.com,www.fermatmind.com
          NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
          NEXT_PUBLIC_ANALYTICS_ENV: production
          NEXT_PUBLIC_API_URL: https://api.fermatmind.com
          NEXT_PUBLIC_BAIDU_TONGJI_ID: 71df4ab76c73cb563d267
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-5TBDR9KBLW
          NEXT_PUBLIC_SITE_URL: https://fermatmind.com
          NEXT_PUBLIC_USE_SAME_ORIGIN_API_PROXY: "false"
        run: |
          set -euo pipefail
          NEXT_PUBLIC_RELEASE="$DEPLOY_SHA"
          export NEXT_PUBLIC_RELEASE

          artifact_zip="$PROMOTION_ROOT/fap-web-standalone-${DEPLOY_SHA}.zip"
          archive_name="fap-web-${DEPLOY_SHA}.tar.gz"
          release_archive="$PROMOTION_ROOT/$archive_name"
          extracted_root="$PROMOTION_ROOT/extracted"
          release_directory="$extracted_root/fap-web-${DEPLOY_SHA}"
          mkdir -p "$extracted_root"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$artifact_zip"
          actual_artifact_digest="sha256:$(sha256sum "$artifact_zip" | awk '{print $1}')"
          test "$actual_artifact_digest" = "$ARTIFACT_DIGEST"

          gh attestation verify "$artifact_zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref refs/heads/main \
            --source-digest "$DEPLOY_SHA"

          mapfile -t zip_entries < <(unzip -Z1 "$artifact_zip")
          test "${#zip_entries[@]}" -eq 1
          test "${zip_entries[0]}" = "$archive_name"
          unzip -q "$artifact_zip" -d "$PROMOTION_ROOT"
          while IFS= read -r entry; do
            test -n "$entry"
            [[ "$entry" != /* ]]
            [[ "$entry" != *"/../"* && "$entry" != "../"* && "$entry" != *"/.." ]]
            case "$entry" in
              "fap-web-${DEPLOY_SHA}"|"fap-web-${DEPLOY_SHA}/"*) ;;
              *) echo "Archive entry escaped exact-SHA release root: $entry" >&2; exit 1 ;;
            esac
          done < <(tar -tzf "$release_archive")
          tar -xzf "$release_archive" -C "$extracted_root"

          node scripts/release/standalone-release.mjs verify \
            --artifact="$release_directory" \
            --expected-git-sha="$DEPLOY_SHA" \
            --require-production-config
          actual_manifest_digest="sha256:$(sha256sum "$release_directory/RELEASE_MANIFEST.json" | awk '{print $1}')"
          test "$actual_manifest_digest" = "$RELEASE_MANIFEST_DIGEST"

          release_archive_sha256="$(sha256sum "$release_archive" | awk '{print $1}')"
          remote_artifact_dir="${APP_DIR%/}/.deploy-artifacts/${DEPLOY_SHA}-${release_archive_sha256}"

          {
            echo "RELEASE_ARCHIVE=$release_archive"
            echo "RELEASE_ARCHIVE_SHA256=$release_archive_sha256"
            echo "REMOTE_CONTROL_DIR=${APP_DIR%/}/.deploy-incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "REMOTE_ARTIFACT_DIR=$remote_artifact_dir"
            echo "REMOTE_RELEASE_ARCHIVE=$remote_artifact_dir/fap-web-${DEPLOY_SHA}.tar.gz"
            echo "REMOTE_RELEASE_ARCHIVE_PART=$remote_artifact_dir/fap-web-${DEPLOY_SHA}.tar.gz.part"
          } >> "$GITHUB_ENV"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known_hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH preflight
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync >/dev/null
          source scripts/production_deploy_retry.sh
          retry_ssh_transport preflight \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "whoami; hostname; command -v rsync >/dev/null; test -d '$APP_DIR' && mkdir -p '$REMOTE_CONTROL_DIR' '$REMOTE_ARTIFACT_DIR' && chmod 700 '$REMOTE_CONTROL_DIR' '$REMOTE_ARTIFACT_DIR'"

      - name: Transfer production control scripts
        shell: bash
        run: |
          set -euo pipefail
          source scripts/production_deploy_retry.sh
          retry_ssh_transport control-files \
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -P "$DEPLOY_PORT" \
            scripts/install_standalone_release.sh \
            scripts/deploy_web_pm2.sh \
            scripts/rolling_reload_pm2.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_CONTROL_DIR/"

      - name: Resume and verify receipt-bound release archive
        shell: bash
        run: |
          set -euo pipefail
          source scripts/production_deploy_retry.sh

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          for value in \
            "$ARTIFACT_TRANSFER_ATTEMPTS" \
            "$ARTIFACT_TRANSFER_DELAY_SECONDS" \
            "$ARTIFACT_TRANSFER_IO_TIMEOUT_SECONDS"
          do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done

          cache_state="$(
            retry_ssh_transport artifact-cache-check \
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -e; if [ -f '$REMOTE_RELEASE_ARCHIVE' ]; then actual=\$(sha256sum '$REMOTE_RELEASE_ARCHIVE' | awk '{print \$1}'); test \"\$actual\" = '$RELEASE_ARCHIVE_SHA256'; echo verified; else echo missing; fi"
          )"

          if [[ "$cache_state" != "verified" ]]; then
            [[ "$cache_state" == "missing" ]]
            transfer_complete="false"
            for ((attempt = 1; attempt <= ARTIFACT_TRANSFER_ATTEMPTS; attempt += 1)); do
              set +e
              rsync \
                --partial \
                --append-verify \
                --protect-args \
                --timeout="$ARTIFACT_TRANSFER_IO_TIMEOUT_SECONDS" \
                -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p $DEPLOY_PORT" \
                -- \
                "$RELEASE_ARCHIVE" \
                "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_RELEASE_ARCHIVE_PART"
              rsync_rc=$?
              set -e

              if [[ "$rsync_rc" -eq 0 ]]; then
                transfer_complete="true"
                break
              fi

              case "$rsync_rc" in
                10|12|30|35|255) ;;
                *)
                  echo "Artifact transfer failed with non-transport rsync exit ${rsync_rc}; refusing to retry" >&2
                  exit "$rsync_rc"
                  ;;
              esac

              if [[ "$attempt" -eq "$ARTIFACT_TRANSFER_ATTEMPTS" ]]; then
                echo "Artifact transport failure persisted after ${ARTIFACT_TRANSFER_ATTEMPTS} attempts" >&2
                exit "$rsync_rc"
              fi

              echo "Artifact transport failed on attempt ${attempt}; resuming in ${ARTIFACT_TRANSFER_DELAY_SECONDS}s" >&2
              sleep "$ARTIFACT_TRANSFER_DELAY_SECONDS"
            done
            [[ "$transfer_complete" == "true" ]]

            retry_ssh_transport artifact-finalize \
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -e; if [ -f '$REMOTE_RELEASE_ARCHIVE' ]; then actual=\$(sha256sum '$REMOTE_RELEASE_ARCHIVE' | awk '{print \$1}'); test \"\$actual\" = '$RELEASE_ARCHIVE_SHA256'; exit 0; fi; test -f '$REMOTE_RELEASE_ARCHIVE_PART'; actual=\$(sha256sum '$REMOTE_RELEASE_ARCHIVE_PART' | awk '{print \$1}'); test \"\$actual\" = '$RELEASE_ARCHIVE_SHA256'; mv -f '$REMOTE_RELEASE_ARCHIVE_PART' '$REMOTE_RELEASE_ARCHIVE'; test \"\$(sha256sum '$REMOTE_RELEASE_ARCHIVE' | awk '{print \$1}')\" = '$RELEASE_ARCHIVE_SHA256'"
          fi

      - name: Promote receipt-bound immutable release
        shell: bash
        run: |
          set -euo pipefail
          # Business promotion is intentionally single-shot. Retrying after an
          # ambiguous disconnect could replay the atomic release switch.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$REMOTE_CONTROL_DIR/'*.sh && APP_DIR='$APP_DIR' APP_USER='$DEPLOY_USER' APP_NAME='$APP_NAME' APP_PORT='$APP_PORT' APP_MANAGER='$APP_MANAGER' SYSTEMD_SERVICE='$SYSTEMD_SERVICE' PUBLIC_BASE_URL='$PUBLIC_BASE_URL' DEPLOY_SHA='$DEPLOY_SHA' ARTIFACT_DIGEST='$ARTIFACT_DIGEST' ARCHIVE_SHA256='$RELEASE_ARCHIVE_SHA256' RELEASE_MANIFEST_DIGEST='$RELEASE_MANIFEST_DIGEST' RELEASE_ARCHIVE='$REMOTE_RELEASE_ARCHIVE' DEPLOY_SCRIPT='$REMOTE_CONTROL_DIR/deploy_web_pm2.sh' ROLLING_RELOAD_SCRIPT='$REMOTE_CONTROL_DIR/rolling_reload_pm2.sh' RUN_SITEMAP_HEALTH='$RUN_SITEMAP_HEALTH' CORE_PUBLIC_PATH='$CORE_PUBLIC_PATH' RUN_CMS_BASELINE_STAGING_SMOKE='0' RUN_CONTENT_RELEASE_REVALIDATE_SMOKE='0' bash '$REMOTE_CONTROL_DIR/install_standalone_release.sh'"

      - name: Poll deployed revision endpoint
        shell: bash
        run: |
          set -euo pipefail
          source scripts/production_deploy_retry.sh
          poll_deployed_revision "${PUBLIC_BASE_URL%/}/revision" "$DEPLOY_SHA"

      - name: Smoke production public surfaces
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          curl -fsSIL "${PUBLIC_BASE_URL}/en" | sed -n '1,20p'
          curl -fsSIL "${PUBLIC_BASE_URL}/zh" | sed -n '1,20p'
          curl -fsSIL "${PUBLIC_BASE_URL}${CORE_PUBLIC_PATH}" | sed -n '1,20p'
          curl -fsSI "${PUBLIC_BASE_URL}/sitemap.xml" | sed -n '1,20p'
          curl -fsSI "${PUBLIC_BASE_URL}/llms.txt" | sed -n '1,20p'
          curl -fsSI "${PUBLIC_BASE_URL}/llms-full.txt" | sed -n '1,20p'

          for path in /zh /zh/personality/intj-a /zh/articles; do
            curl -fsSL -o "$body_file" "${PUBLIC_BASE_URL}${path}"
            grep -q 'fm-analytics-bootstrap' "$body_file"
          done

          for path in /zh/result/SYNTHETIC_DO_NOT_USE /zh/orders/lookup /zh/pay/wait /zh/payment/stripe/cancel; do
            curl -sSL -o "$body_file" "${PUBLIC_BASE_URL}${path}"
            if grep -Eiq 'fm-analytics-bootstrap|data-analytics-bootstrap|googletagmanager|hm\.baidu' "$body_file"; then
              echo "private analytics smoke failed path=${path}" >&2
              exit 1
            fi
          done

      - name: Run read-only test landing regression smoke
        id: test_landing_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/test-landing-runtime-smoke"
          mkdir -p "$smoke_dir"
          node scripts/deploy/test-landing-runtime-smoke.mjs \
            --base-url "$PUBLIC_BASE_URL" \
            --api-base-url "https://api.fermatmind.com" \
            --environment "production" \
            --exact-sha "$DEPLOY_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$smoke_dir/receipt.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized test landing smoke receipt
        if: always() && steps.test_landing_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-landing-runtime-smoke-production-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/test-landing-runtime-smoke/receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Enforce test landing smoke result
        if: always() && steps.test_landing_smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "Read-only test landing regression smoke failed closed." >&2
          exit 1

      - name: Write production promotion receipts
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/production-receipts"
          analytics_dir="$RUNNER_TEMP/analytics-runtime-smoke"
          mkdir -p "$receipt_dir" "$analytics_dir"
          PRODUCTION_RECEIPT_PATH="$receipt_dir/production-receipt-${DEPLOY_SHA}.json"
          ANALYTICS_PROVENANCE_PATH="$analytics_dir/report.json"
          export PRODUCTION_RECEIPT_PATH ANALYTICS_PROVENANCE_PATH
          node <<'NODE'
          const fs = require("node:fs");
          const shared = {
            source_sha: process.env.DEPLOY_SHA,
            artifact_digest: process.env.ARTIFACT_DIGEST,
            release_manifest_digest: process.env.RELEASE_MANIFEST_DIGEST,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            production_run_id: process.env.GITHUB_RUN_ID,
            production_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
          };
          fs.writeFileSync(
            process.env.PRODUCTION_RECEIPT_PATH,
            `${JSON.stringify({
              schema: "fermatmind.web.production-receipt.v1",
              ...shared,
              environment: "production",
              result: "success",
            }, null, 2)}\n`,
            { mode: 0o444 },
          );
          fs.writeFileSync(
            process.env.ANALYTICS_PROVENANCE_PATH,
            `${JSON.stringify({
              schema_version: "promotion-provenance.v1",
              production_deployment_sha: shared.source_sha,
              artifact_digest: shared.artifact_digest,
              release_manifest_digest: shared.release_manifest_digest,
              health_status: "http_smoke_passed",
              telemetry_probe: "deferred_to_analytics_runtime_monitor",
            }, null, 2)}\n`,
            { mode: 0o444 },
          );
          NODE
          {
            echo "PRODUCTION_RECEIPT_PATH=$PRODUCTION_RECEIPT_PATH"
            echo "ANALYTICS_PROVENANCE_PATH=$ANALYTICS_PROVENANCE_PATH"
          } >> "$GITHUB_ENV"

      - name: Upload exact-SHA production promotion receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fap-web-production-receipt-${{ needs.policy-guard.outputs.deploy_sha }}
          path: ${{ env.PRODUCTION_RECEIPT_PATH }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload analytics deployment provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analytics-runtime-smoke-${{ needs.policy-guard.outputs.deploy_sha }}
          path: ${{ env.ANALYTICS_PROVENANCE_PATH }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
