name: Deploy Web Staging

on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENTS.md"
      - "docs/codex/fermatmind-codex-workflow-and-personalization.md"
      - ".github/workflows/deploy-staging.yml"
      - "scripts/ops/fermatmind-operation-guard"
      - "scripts/ops/fermatmind-task-status"
      - "tests/ops/fermatmind-operation-guard.test.sh"
      - "tests/contracts/solo-owner-operation-guard.contract.test.ts"
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Exact latest main commit SHA to deploy."
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  deploy:
    name: Deploy fap-web staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: fap-web-staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
    env:
      DEPLOY_HOST: ${{ secrets.WEB_STAGING_DEPLOY_HOST || vars.WEB_STAGING_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.WEB_STAGING_DEPLOY_USER || vars.WEB_STAGING_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.WEB_STAGING_DEPLOY_PORT || vars.WEB_STAGING_DEPLOY_PORT }}
      APP_DIR: ${{ secrets.WEB_STAGING_APP_DIR || vars.WEB_STAGING_APP_DIR }}
      APP_NAME: ${{ secrets.WEB_STAGING_APP_NAME || vars.WEB_STAGING_APP_NAME }}
      APP_PORT: ${{ secrets.WEB_STAGING_APP_PORT || vars.WEB_STAGING_APP_PORT }}
      APP_MANAGER: ${{ secrets.WEB_STAGING_APP_MANAGER || vars.WEB_STAGING_APP_MANAGER }}
      SYSTEMD_SERVICE: ${{ secrets.WEB_STAGING_SYSTEMD_SERVICE || vars.WEB_STAGING_SYSTEMD_SERVICE }}
      PUBLIC_BASE_URL: ${{ secrets.WEB_STAGING_PUBLIC_BASE_URL || vars.WEB_STAGING_PUBLIC_BASE_URL }}
      RUN_SITEMAP_HEALTH: ${{ secrets.WEB_STAGING_RUN_SITEMAP_HEALTH || vars.WEB_STAGING_RUN_SITEMAP_HEALTH }}
      CORE_PUBLIC_PATH: ${{ secrets.WEB_STAGING_CORE_PUBLIC_PATH || vars.WEB_STAGING_CORE_PUBLIC_PATH }}
      SSH_RETRY_ATTEMPTS: "3"
      SSH_RETRY_DELAY_SECONDS: "10"
      STAGING_DEPLOY_SKIP: "false"

    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve staging deploy revision
        id: deploy_ref
        shell: bash
        env:
          DISPATCH_DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$DISPATCH_DEPLOY_SHA" ]; then
              echo "Manual staging deploy failed closed: deploy_sha is required." >&2
              exit 1
            fi
            DEPLOY_SHA="$DISPATCH_DEPLOY_SHA"
          else
            DEPLOY_SHA="$GITHUB_SHA"
          fi

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Staging deploy failed closed: deploy SHA must be a 40-character lowercase hex commit SHA." >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          LATEST_MAIN_SHA="$(git rev-parse origin/main)"
          echo "deploy_sha=$DEPLOY_SHA"
          echo "latest_main_sha=$LATEST_MAIN_SHA"

          if [ "$DEPLOY_SHA" != "$LATEST_MAIN_SHA" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Skip stale staging deploy: deploy_sha=$DEPLOY_SHA latest=$LATEST_MAIN_SHA"
              echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
              echo "STAGING_DEPLOY_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Manual staging deploy failed closed: deploy_sha must equal latest origin/main." >&2
            exit 1
          fi

          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Wait for exact-SHA CI artifact
        if: steps.deploy_ref.outputs.skip_deploy != 'true'
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const expectedName = `fap-web-standalone-${sha}`;
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            for (let attempt = 1; attempt <= 48; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                head_sha: sha,
                per_page: 20,
              });
              const run = runs.data.workflow_runs.find(
                (candidate) => candidate.head_sha === sha && candidate.event === "push",
              );

              if (run?.status === "completed" && run.conclusion !== "success") {
                core.setFailed(`Exact-SHA CI run completed without success: ${run.conclusion}`);
                return;
              }

              if (run?.status === "completed" && run.conclusion === "success") {
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const matches = artifacts.data.artifacts.filter(
                  (artifact) => artifact.name === expectedName && !artifact.expired,
                );
                if (matches.length !== 1) {
                  core.setFailed(`Expected exactly one unexpired ${expectedName} artifact; found ${matches.length}`);
                  return;
                }
                const artifact = matches[0];
                if (!/^sha256:[0-9a-f]{64}$/.test(String(artifact.digest || ""))) {
                  core.setFailed("Exact-SHA artifact is missing its immutable SHA-256 digest");
                  return;
                }
                core.setOutput("artifact-id", String(artifact.id));
                core.setOutput("artifact-digest", artifact.digest);
                core.setOutput("ci-run-id", String(run.id));
                core.setOutput("ci-run-attempt", String(run.run_attempt));
                return;
              }

              core.info(`Waiting for exact-SHA CI artifact (${attempt}/48)`);
              await sleep(15000);
            }
            core.setFailed("Timed out waiting for the exact-SHA successful CI artifact");

      - name: Verify artifact provenance and integrity before SSH
        if: steps.deploy_ref.outputs.skip_deploy != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.release.outputs.artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.release.outputs.artifact-digest }}
          NEXT_PUBLIC_ANALYTICS_ALLOWED_HOSTS: fermatmind.com,www.fermatmind.com
          NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
          NEXT_PUBLIC_ANALYTICS_ENV: production
          NEXT_PUBLIC_API_URL: https://api.fermatmind.com
          NEXT_PUBLIC_BAIDU_TONGJI_ID: 71df4ab76c73cb563d267
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-5TBDR9KBLW
          NEXT_PUBLIC_SITE_URL: https://fermatmind.com
          NEXT_PUBLIC_USE_SAME_ORIGIN_API_PROXY: "false"
        run: |
          set -euo pipefail
          NEXT_PUBLIC_RELEASE="$DEPLOY_SHA"
          export NEXT_PUBLIC_RELEASE

          release_root="$RUNNER_TEMP/staging-release-${DEPLOY_SHA}"
          artifact_zip="$release_root/fap-web-standalone-${DEPLOY_SHA}.zip"
          archive_name="fap-web-${DEPLOY_SHA}.tar.gz"
          release_archive="$release_root/$archive_name"
          extracted_root="$release_root/extracted"
          release_directory="$extracted_root/fap-web-${DEPLOY_SHA}"
          mkdir -p "$release_root" "$extracted_root"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$artifact_zip"

          actual_artifact_digest="sha256:$(sha256sum "$artifact_zip" | awk '{print $1}')"
          test "$actual_artifact_digest" = "$EXPECTED_ARTIFACT_DIGEST"

          gh attestation verify "$artifact_zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref refs/heads/main \
            --source-digest "$DEPLOY_SHA"

          mapfile -t zip_entries < <(unzip -Z1 "$artifact_zip")
          test "${#zip_entries[@]}" -eq 1
          test "${zip_entries[0]}" = "$archive_name"
          unzip -q "$artifact_zip" -d "$release_root"

          while IFS= read -r entry; do
            test -n "$entry"
            [[ "$entry" != /* ]]
            [[ "$entry" != *"/../"* && "$entry" != "../"* && "$entry" != *"/.." ]]
            case "$entry" in
              "fap-web-${DEPLOY_SHA}"|"fap-web-${DEPLOY_SHA}/"*) ;;
              *) echo "Archive entry escaped exact-SHA release root: $entry" >&2; exit 1 ;;
            esac
          done < <(tar -tzf "$release_archive")
          tar -xzf "$release_archive" -C "$extracted_root"

          node scripts/release/standalone-release.mjs verify \
            --artifact="$release_directory" \
            --expected-git-sha="$DEPLOY_SHA" \
            --require-production-config

          manifest_digest="sha256:$(sha256sum "$release_directory/RELEASE_MANIFEST.json" | awk '{print $1}')"
          archive_sha256="$(sha256sum "$release_archive" | awk '{print $1}')"
          {
            echo "ARTIFACT_DIGEST=$actual_artifact_digest"
            echo "RELEASE_MANIFEST_DIGEST=$manifest_digest"
            echo "RELEASE_ARCHIVE_SHA256=$archive_sha256"
            echo "RELEASE_ARCHIVE=$release_archive"
            echo "REMOTE_CONTROL_DIR=${APP_DIR%/}/.deploy-incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Reconfirm latest-main immediately before SSH
        id: pre_ssh_latest
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        env:
          DISPATCH_DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          LATEST_MAIN_SHA="$(git rev-parse origin/main)"
          echo "pre_ssh_deploy_sha=$DEPLOY_SHA"
          echo "pre_ssh_latest_main_sha=$LATEST_MAIN_SHA"

          if [ "$DEPLOY_SHA" != "$LATEST_MAIN_SHA" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Skip stale staging deploy before SSH: deploy_sha=$DEPLOY_SHA latest=$LATEST_MAIN_SHA"
              echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
              echo "STAGING_DEPLOY_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Manual staging deploy failed closed before SSH: deploy_sha must equal latest origin/main." >&2
            exit 1
          fi

      - name: Deduplicate exact-SHA staging deployment before SSH
        id: staging_dedupe
        if: env.STAGING_DEPLOY_SKIP != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const currentRunId = Number(process.env.CURRENT_RUN_ID);
            const currentRunAttempt = Number(process.env.CURRENT_RUN_ATTEMPT);
            const isManual = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
            const expectedReceiptName = `fap-web-staging-receipt-${sha}`;
            const dedupeKey = `${context.repo.owner}/${context.repo.repo}:staging:${sha}`;
            const activeStatuses = new Set(["queued", "in_progress", "waiting", "requested", "pending"]);
            const skip = (state, message, details = {}) => {
              core.notice(message);
              core.setOutput("skip_deploy", "true");
              core.setOutput("dedupe_state", state);
              core.setOutput("dedupe_key", dedupeKey);
              for (const [key, value] of Object.entries(details)) {
                core.setOutput(key, String(value));
              }
              core.exportVariable("STAGING_DEPLOY_SKIP", "true");
            };

            core.setOutput("skip_deploy", "false");
            core.setOutput("dedupe_state", "deploy");
            core.setOutput("dedupe_key", dedupeKey);
            core.info(`staging_dedupe_key=${dedupeKey}`);

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-staging.yml",
              branch: "main",
              head_sha: sha,
              per_page: 100,
            });
            const candidates = response.data.workflow_runs
              .filter((run) => run.id !== currentRunId && run.head_sha === sha && run.head_branch === "main")
              .sort((left, right) => String(right.created_at).localeCompare(String(left.created_at)));

            for (const run of candidates) {
              if (run.status !== "completed" || run.conclusion !== "success") {
                continue;
              }
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const receipts = artifacts.data.artifacts.filter(
                (artifact) => artifact.name === expectedReceiptName && !artifact.expired,
              );
              if (receipts.length === 0) {
                continue;
              }
              if (receipts.length !== 1) {
                core.setFailed(`Successful staging run ${run.id} has ${receipts.length} exact-SHA receipts; expected one.`);
                return;
              }
              const receipt = receipts[0];
              if (!/^sha256:[0-9a-f]{64}$/.test(String(receipt.digest || ""))) {
                core.setFailed(`Existing staging receipt ${receipt.id} is missing its immutable SHA-256 digest.`);
                return;
              }
              skip(
                "success_receipt_exists",
                `Skip duplicate staging deploy; exact-SHA success receipt already exists in run ${run.id}.`,
                {
                  existing_run_id: run.id,
                  existing_run_attempt: run.run_attempt,
                  existing_receipt_artifact_id: receipt.id,
                  existing_receipt_artifact_digest: receipt.digest,
                },
              );
              return;
            }

            const active = candidates.find((run) => activeStatuses.has(run.status));
            if (active) {
              skip(
                "deployment_running",
                `Skip duplicate staging deploy; exact-SHA run ${active.id} is already ${active.status}.`,
                {
                  existing_run_id: active.id,
                  existing_run_attempt: active.run_attempt,
                },
              );
              return;
            }

            const failed = candidates.find(
              (run) => run.status === "completed" && run.conclusion !== "success",
            );
            if (!isManual && (failed || currentRunAttempt > 1)) {
              skip(
                "failed_requires_manual_retry",
                "Skip automatic staging retry; a failed exact-SHA deployment requires explicit workflow_dispatch.",
                failed
                  ? {
                      existing_run_id: failed.id,
                      existing_run_attempt: failed.run_attempt,
                    }
                  : {},
              );
              return;
            }

            if (isManual && failed) {
              core.notice(`Explicit manual retry allowed after failed exact-SHA run ${failed.id}.`);
            }

      - name: Set up SSH
        if: env.STAGING_DEPLOY_SKIP != 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known_hosts
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH preflight
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$APP_DIR"
          test -n "$APP_NAME"
          test -n "$APP_PORT"
          test -n "$APP_MANAGER"
          test -n "$SYSTEMD_SERVICE"
          test -n "$PUBLIC_BASE_URL"
          : "${DEPLOY_PORT:=22}"
          : "${RUN_SITEMAP_HEALTH:=0}"
          : "${CORE_PUBLIC_PATH:=/zh/career/jobs/accountants-and-auditors}"
          ssh_retry() {
            local attempt rc
            for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
              set +e
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
                -p "$DEPLOY_PORT" "$@"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -ne 255 ]; then return "$rc"; fi
              if [ "$attempt" -eq "$SSH_RETRY_ATTEMPTS" ]; then return "$rc"; fi
              echo "SSH preflight attempt $attempt failed; retrying in ${SSH_RETRY_DELAY_SECONDS}s" >&2
              sleep "$SSH_RETRY_DELAY_SECONDS"
            done
          }
          ssh_retry "$DEPLOY_USER@$DEPLOY_HOST" \
            "whoami; hostname; test -d '$APP_DIR' && mkdir -p '$REMOTE_CONTROL_DIR' && chmod 700 '$REMOTE_CONTROL_DIR'"

      - name: Transfer and activate verified immutable release
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -P "$DEPLOY_PORT" \
            "$RELEASE_ARCHIVE" \
            scripts/install_standalone_release.sh \
            scripts/deploy_web_pm2.sh \
            scripts/rolling_reload_pm2.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_CONTROL_DIR/"

          ssh_retry() {
            local attempt rc
            for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
              set +e
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
                -p "$DEPLOY_PORT" "$@"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -ne 255 ]; then return "$rc"; fi
              if [ "$attempt" -eq "$SSH_RETRY_ATTEMPTS" ]; then return "$rc"; fi
              echo "SSH deploy attempt $attempt failed; retrying in ${SSH_RETRY_DELAY_SECONDS}s" >&2
              sleep "$SSH_RETRY_DELAY_SECONDS"
            done
          }
          ssh_retry "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$REMOTE_CONTROL_DIR/'*.sh && APP_DIR='$APP_DIR' APP_USER='$DEPLOY_USER' APP_NAME='$APP_NAME' APP_PORT='$APP_PORT' APP_MANAGER='$APP_MANAGER' SYSTEMD_SERVICE='$SYSTEMD_SERVICE' PUBLIC_BASE_URL='$PUBLIC_BASE_URL' DEPLOY_SHA='$DEPLOY_SHA' ARTIFACT_DIGEST='$ARTIFACT_DIGEST' ARCHIVE_SHA256='$RELEASE_ARCHIVE_SHA256' RELEASE_MANIFEST_DIGEST='$RELEASE_MANIFEST_DIGEST' RELEASE_ARCHIVE='$REMOTE_CONTROL_DIR/fap-web-$DEPLOY_SHA.tar.gz' DEPLOY_SCRIPT='$REMOTE_CONTROL_DIR/deploy_web_pm2.sh' ROLLING_RELOAD_SCRIPT='$REMOTE_CONTROL_DIR/rolling_reload_pm2.sh' RUN_SITEMAP_HEALTH='$RUN_SITEMAP_HEALTH' CORE_PUBLIC_PATH='$CORE_PUBLIC_PATH' bash '$REMOTE_CONTROL_DIR/install_standalone_release.sh'"

      - name: Verify deployed revision
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh_retry() {
            local attempt rc
            for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
              set +e
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
                -p "$DEPLOY_PORT" "$@"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then return 0; fi
              if [ "$rc" -ne 255 ]; then return "$rc"; fi
              if [ "$attempt" -eq "$SSH_RETRY_ATTEMPTS" ]; then return "$rc"; fi
              echo "SSH verify attempt $attempt failed; retrying in ${SSH_RETRY_DELAY_SECONDS}s" >&2
              sleep "$SSH_RETRY_DELAY_SECONDS"
            done
          }
          DEPLOYED_SHA="$(ssh_retry "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '[:space:]' < '$APP_DIR/REVISION'")"
          echo "deployed_sha=$DEPLOYED_SHA"
          test "$DEPLOYED_SHA" = "$DEPLOY_SHA"

      - name: Smoke staging career page
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI "${PUBLIC_BASE_URL}${CORE_PUBLIC_PATH}" | sed -n '1,20p'

      - name: Run read-only test landing regression smoke
        if: env.STAGING_DEPLOY_SKIP != 'true'
        id: test_landing_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/test-landing-runtime-smoke"
          mkdir -p "$smoke_dir"
          node scripts/deploy/test-landing-runtime-smoke.mjs \
            --base-url "$PUBLIC_BASE_URL" \
            --api-base-url "https://api.fermatmind.com" \
            --environment "staging" \
            --exact-sha "$DEPLOY_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$smoke_dir/receipt.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized test landing smoke receipt
        if: always() && env.STAGING_DEPLOY_SKIP != 'true' && steps.test_landing_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-landing-runtime-smoke-staging-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/test-landing-runtime-smoke/receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Enforce test landing smoke result
        if: always() && env.STAGING_DEPLOY_SKIP != 'true' && steps.test_landing_smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "Read-only test landing regression smoke failed closed." >&2
          exit 1

      - name: Write staging success receipt
        if: env.STAGING_DEPLOY_SKIP != 'true'
        shell: bash
        env:
          CI_RUN_ID: ${{ steps.release.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ steps.release.outputs.ci-run-attempt }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/staging-receipt"
          receipt_path="$receipt_dir/staging-receipt-${DEPLOY_SHA}.json"
          mkdir -p "$receipt_dir"
          RECEIPT_PATH="$receipt_path" node <<'NODE'
          const fs = require("node:fs");
          const receipt = {
            schema: "fermatmind.web.staging-receipt.v1",
            source_sha: process.env.DEPLOY_SHA,
            artifact_digest: process.env.ARTIFACT_DIGEST,
            release_manifest_digest: process.env.RELEASE_MANIFEST_DIGEST,
            ci_run_id: process.env.CI_RUN_ID,
            ci_run_attempt: process.env.CI_RUN_ATTEMPT,
            deploy_run_id: process.env.GITHUB_RUN_ID,
            deploy_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            environment: "staging",
            result: "success",
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o444 });
          NODE
          echo "STAGING_RECEIPT_PATH=$receipt_path" >> "$GITHUB_ENV"

      - name: Upload exact-SHA staging success receipt
        if: env.STAGING_DEPLOY_SKIP != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fap-web-staging-receipt-${{ env.DEPLOY_SHA }}
