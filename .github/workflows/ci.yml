name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      NEXT_PUBLIC_ANALYTICS_ALLOWED_HOSTS: fermatmind.com,www.fermatmind.com
      # These identifiers are public in the client bootstrap. Keeping them here
      # avoids granting the CI build job access to protected production secrets.
      NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
      NEXT_PUBLIC_ANALYTICS_ENV: production
      NEXT_PUBLIC_API_URL: https://api.fermatmind.com
      NEXT_PUBLIC_BAIDU_TONGJI_ID: 71df4ab76c73cb563d267
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-5TBDR9KBLW
      NEXT_PUBLIC_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: https://fermatmind.com
      NEXT_PUBLIC_USE_SAME_ORIGIN_API_PROXY: "false"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint . --max-warnings=0

      - name: Reject warnings in pull request JavaScript and TypeScript changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR -z HEAD^1 HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' \
            | xargs -0 --no-run-if-empty pnpm exec eslint --max-warnings=0 --

      - run: pnpm typecheck

      - run: pnpm build

      - name: Verify standalone analytics bootstrap without runtime public env
        run: node scripts/release/verify-standalone-analytics-bootstrap.mjs

      - name: Package and verify immutable standalone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          RELEASE_DIRECTORY: .next/release/fap-web-${{ github.sha }}
          RELEASE_ARCHIVE: .next/release/fap-web-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm release:package -- \
            --source=.next/standalone \
            --output="$RELEASE_DIRECTORY" \
            --git-sha="$GITHUB_SHA" \
            --build-timestamp="$build_timestamp" \
            --workflow-run-id="$GITHUB_RUN_ID" \
            --workflow-run-attempt="$GITHUB_RUN_ATTEMPT" \
            --require-production-config
          pnpm release:verify -- --artifact="$RELEASE_DIRECTORY"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C .next/release -czf "$RELEASE_ARCHIVE" "fap-web-${GITHUB_SHA}"

      - name: Upload exact-SHA standalone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fap-web-standalone-${{ github.sha }}
          path: .next/release/fap-web-${{ github.sha }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Attest exact uploaded standalone archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: fap-web-standalone-${{ github.sha }}.zip
          subject-digest: sha256:${{ steps.upload-release.outputs.artifact-digest }}

      - run: pnpm test:a11y

  contract-shards:
    name: contract-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Run contract shard ${{ matrix.shard }} of 4
        run: pnpm test:contract -- --shards=4 --only-shard=${{ matrix.shard }}

  contracts:
    name: contracts
    needs: contract-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require all four contract shards to succeed
        shell: bash
        env:
          CONTRACT_MATRIX_RESULT: ${{ needs.contract-shards.result }}
        run: |
          set -euo pipefail
          if [[ "$CONTRACT_MATRIX_RESULT" != "success" ]]; then
            echo "One or more of the four contract shards did not succeed: $CONTRACT_MATRIX_RESULT" >&2
            exit 1
          fi

  verify-big5-contract-freeze:
    name: verify-big5-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run tests/contracts/big5.contract.test.ts tests/contracts/big5-result-assembler.contract.test.ts tests/contracts/big5-secondary-surfaces.contract.test.tsx

  verify-enneagram-contract-freeze:
    name: verify-enneagram-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run tests/contracts/enneagram-api.contract.test.ts tests/contracts/enneagram-take-flow.contract.test.tsx tests/contracts/enneagram-result-assembler.contract.test.ts tests/contracts/enneagram-rich-result-report.contract.test.tsx tests/contracts/enneagram-secondary-surfaces.contract.test.tsx
