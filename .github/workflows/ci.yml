name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SITE_URL: https://fermatmind.com

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint . --max-warnings=0

      - name: Reject warnings in pull request JavaScript and TypeScript changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR -z HEAD^1 HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' \
            | xargs -0 --no-run-if-empty pnpm exec eslint --max-warnings=0 --

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test:a11y

  contract-shards:
    name: contract-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Run contract shard ${{ matrix.shard }} of 4
        run: pnpm test:contract -- --shards=4 --only-shard=${{ matrix.shard }}

  contracts:
    name: contracts
    needs: contract-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require all four contract shards to succeed
        shell: bash
        env:
          CONTRACT_MATRIX_RESULT: ${{ needs.contract-shards.result }}
        run: |
          set -euo pipefail
          if [[ "$CONTRACT_MATRIX_RESULT" != "success" ]]; then
            echo "One or more of the four contract shards did not succeed: $CONTRACT_MATRIX_RESULT" >&2
            exit 1
          fi

  verify-big5-contract-freeze:
    name: verify-big5-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run tests/contracts/big5.contract.test.ts tests/contracts/big5-result-assembler.contract.test.ts tests/contracts/big5-secondary-surfaces.contract.test.tsx

  verify-enneagram-contract-freeze:
    name: verify-enneagram-contract-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run tests/contracts/enneagram-api.contract.test.ts tests/contracts/enneagram-take-flow.contract.test.tsx tests/contracts/enneagram-result-assembler.contract.test.ts tests/contracts/enneagram-rich-result-report.contract.test.tsx tests/contracts/enneagram-secondary-surfaces.contract.test.tsx
