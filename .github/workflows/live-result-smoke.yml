name: Live result smoke

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fap-web-production-api-read
  cancel-in-progress: false

jobs:
  certificate-expiry:
    name: Public TLS certificate expiry
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Verify public certificate chains and renewal headroom
        run: >-
          node scripts/ops/check-public-tls-certificates.mjs
          --hosts fermatmind.com,api.fermatmind.com,staging.fermatmind.com,staging-api.fermatmind.com
          --alert-days 21,14,7

  submit-result-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULT_SMOKE_API_ORIGIN: https://api.fermatmind.com
      RESULT_SMOKE_LOCALE: zh-CN
      RESULT_SMOKE_REPORT_TIMEOUT_MS: "90000"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm ops:result-smoke -- --execute --json
