name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 18 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: nightly-${{ github.repository }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  classify:
    name: Select push security scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql: ${{ steps.paths.outputs.codeql }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - id: paths
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { classifyPaths } from './.github/trunk/classify-paths.mjs';
          const base = process.env.PUSH_BEFORE, head = process.env.GITHUB_SHA;
          if (![base, head].every(value => /^[a-f0-9]{40}$/.test(value ?? '') && value !== '0'.repeat(40))) throw new Error('Invalid scan baseline');
          execFileSync('git', ['merge-base', '--is-ancestor', base, head]);
          const paths = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', base, head], {encoding: 'utf8'}).split('\0').filter(Boolean);
          appendFileSync(process.env.GITHUB_OUTPUT, `codeql=${classifyPaths(paths).codeql_required}\n`);
          JS

  full-regression:
    name: Full contracts, accessibility, dependencies, and performance
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm audit --prod --audit-level high
      - run: node --test .github/trunk/*.test.mjs
      - if: ${{ !cancelled() }}
        run: pnpm test:a11y
      - if: ${{ !cancelled() }}
        run: pnpm verify:pr
      - if: ${{ !cancelled() }}
        run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        run: pnpm test:e2e:release
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - if: ${{ !cancelled() }}
        run: pnpm perf:audit:public
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-diagnostics-${{ github.sha }}
          path: |
            generated/test-diagnostics/
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL security scan
    needs: classify
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.classify.result == 'success' && needs.classify.outputs.codeql == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4

  certificate-expiry:
    name: Public TLS certificate expiry
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Verify public certificate chains and renewal headroom
        run: >-
          node scripts/ops/check-public-tls-certificates.mjs
          --hosts fermatmind.com,api.fermatmind.com,staging.fermatmind.com,staging-api.fermatmind.com
          --alert-days 21,14,7

  alert:
    needs: [classify, full-regression, codeql, certificate-expiry]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nightly failed; production remains on its current healthy SHA."
