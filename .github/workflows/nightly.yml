name: Nightly

on:
  schedule:
    - cron: "31 18 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: Full contracts, accessibility, dependencies, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node --test .github/trunk/*.test.mjs
      - run: pnpm verify:pr
      - run: pnpm test:e2e
      - run: pnpm perf:audit:public

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4

  alert:
    needs: [full-regression, codeql]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nightly failed; production remains on its current healthy SHA."
