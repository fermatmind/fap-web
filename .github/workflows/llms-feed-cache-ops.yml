name: LLMS Feed Cache Ops

on:
  workflow_dispatch:
    inputs:
      expected_frontend_sha:
        description: "Exact deployed fap-web Node1 SHA."
        required: true
        type: string
      feed_path:
        description: "Feed to revalidate; llms-full installs an offline complete artifact before PM2 reload."
        required: true
        type: choice
        options:
          - /llms.txt
          - /llms-full.txt
      operator_approval:
        description: "SHA/path/cohort-bound LLMS feed cache operation approval phrase."
        required: true
        type: string
      expected_enneagram_count:
        description: "Expected unique Enneagram canonical count in the selected feed."
        required: true
        type: string
      expected_career_job_url_count:
        description: "Required only for /llms-full.txt; must be the exact bilingual Career URL count."
        required: false
        type: string
      expected_llms_full_mode:
        description: "Required only for /llms-full.txt; must be complete."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fap-web-llms-feed-artifact-ops
  cancel-in-progress: false

jobs:
  llms-feed-cache-ops:
    name: Revalidate llms feed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      EXPECTED_FRONTEND_SHA: ${{ github.event.inputs.expected_frontend_sha }}
      FEED_PATH: ${{ github.event.inputs.feed_path }}
      OPERATOR_APPROVAL: ${{ github.event.inputs.operator_approval }}
      EXPECTED_ENNEAGRAM_COUNT: ${{ github.event.inputs.expected_enneagram_count }}
      EXPECTED_CAREER_JOB_URL_COUNT: ${{ github.event.inputs.expected_career_job_url_count }}
      EXPECTED_LLMS_FULL_MODE: ${{ github.event.inputs.expected_llms_full_mode }}
      DEPLOY_HOST: ${{ secrets.WEB_NODE1_DEPLOY_HOST || vars.WEB_NODE1_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.WEB_NODE1_DEPLOY_USER || vars.WEB_NODE1_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.WEB_NODE1_DEPLOY_PORT || vars.WEB_NODE1_DEPLOY_PORT }}
      APP_DIR: ${{ secrets.WEB_NODE1_APP_DIR || vars.WEB_NODE1_APP_DIR }}
      APP_NAME: ${{ secrets.WEB_NODE1_APP_NAME || vars.WEB_NODE1_APP_NAME }}
      PUBLIC_BASE_URL: ${{ secrets.WEB_PUBLIC_BASE_URL || vars.WEB_PUBLIC_BASE_URL }}
      SSH_RETRY_ATTEMPTS: "3"
      SSH_RETRY_DELAY_SECONDS: "10"

    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_PORT:=22}"
          : "${APP_DIR:=/opt/apps/fap-web}"
          : "${APP_NAME:=fap-web}"
          : "${PUBLIC_BASE_URL:=https://fermatmind.com}"

          [[ "$EXPECTED_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ENNEAGRAM_COUNT" =~ ^[0-9]+$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$APP_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          case "$FEED_PATH" in
            /llms.txt)
              test -z "$EXPECTED_LLMS_FULL_MODE"
              test -z "$EXPECTED_CAREER_JOB_URL_COUNT"
              expected_approval="APPROVE_FAP_WEB_LLMS_FEED_CACHE_OPS:${EXPECTED_FRONTEND_SHA}:/llms.txt:${EXPECTED_ENNEAGRAM_COUNT}"
              ;;
            /llms-full.txt)
              test "$EXPECTED_LLMS_FULL_MODE" = "complete"
              test "$EXPECTED_CAREER_JOB_URL_COUNT" = "2092"
              expected_approval="APPROVE_FAP_WEB_LLMS_FEED_CACHE_OPS:${EXPECTED_FRONTEND_SHA}:/llms-full.txt:${EXPECTED_ENNEAGRAM_COUNT}:${EXPECTED_CAREER_JOB_URL_COUNT}:complete"
              ;;
            *)
              echo "unsupported feed_path=${FEED_PATH}" >&2
              exit 1
              ;;
          esac

          if [ "$OPERATOR_APPROVAL" != "$expected_approval" ]; then
            echo "operator approval does not match the SHA/path/count/mode-bound phrase" >&2
            exit 1
          fi

          {
            echo "DEPLOY_PORT=$DEPLOY_PORT"
            echo "APP_DIR=$APP_DIR"
            echo "APP_NAME=$APP_NAME"
            echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL"
          } >> "$GITHUB_ENV"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known_hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify exact deployed revision before artifact generation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_FRONTEND_SHA='$EXPECTED_FRONTEND_SHA' APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          test -d "$APP_DIR"
          test -f "$APP_DIR/REVISION"
          test "$(tr -d '[:space:]' < "$APP_DIR/REVISION")" = "$EXPECTED_FRONTEND_SHA"
          PM2_JLIST="$(pm2 jlist)" APP_NAME="$APP_NAME" node <<'NODE'
          const rows = JSON.parse(process.env.PM2_JLIST || "[]");
          const apps = rows.filter((item) => item?.name === process.env.APP_NAME);
          if (apps.length < 1 || apps.some((item) => item?.pm2_env?.status !== "online")) {
            throw new Error("expected PM2 application is not fully online");
          }
          const cacheDirs = new Set(
            apps.map((item) => String(item?.pm2_env?.FERMATMIND_LLMS_FULL_CACHE_DIR || "").trim())
          );
          if (cacheDirs.size !== 1 || [...cacheDirs][0] !== "") {
            throw new Error("llms-full cache directory drifted from the supported default");
          }
          NODE
          REMOTE

      - name: Checkout exact frontend revision for offline artifact build
        if: env.FEED_PATH == '/llms-full.txt'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.expected_frontend_sha }}
          fetch-depth: 0

      - name: Set up Node 24 for offline artifact build
        if: env.FEED_PATH == '/llms-full.txt'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install exact frontend dependencies
        if: env.FEED_PATH == '/llms-full.txt'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_FRONTEND_SHA"
          git merge-base --is-ancestor "$EXPECTED_FRONTEND_SHA" origin/main
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build and verify complete llms-full artifact offline
        if: env.FEED_PATH == '/llms-full.txt'
        shell: bash
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.fermatmind.com
          NEXT_PUBLIC_SITE_URL: https://fermatmind.com
          NEXT_PUBLIC_USE_SAME_ORIGIN_API_PROXY: "false"
          FERMATMIND_LLMS_FULL_ENABLE_SHARED_CACHE: "true"
          FERMATMIND_LLMS_FULL_REQUIRE_CAREER_COHORT: "true"
          FERMATMIND_LLMS_FULL_REQUIRE_TEST_COHORT: "true"
          FERMATMIND_LLMS_FULL_REQUIRE_PERSONALITY_COHORT: "true"
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/llms-feed-cache-ops"
          cache_dir="$output_dir/generated-cache"
          mkdir -p "$cache_dir"
          export FERMATMIND_LLMS_FULL_CACHE_DIR="$cache_dir"

          pnpm seo:generate-llms-full > "$output_dir/generator-summary.json"

          OUTPUT_DIR="$output_dir" node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const path = require("node:path");

          const outputDir = process.env.OUTPUT_DIR;
          const generator = JSON.parse(fs.readFileSync(path.join(outputDir, "generator-summary.json"), "utf8"));
          const expectedCareer = Number.parseInt(process.env.EXPECTED_CAREER_JOB_URL_COUNT || "", 10);
          const expectedEnneagram = Number.parseInt(process.env.EXPECTED_ENNEAGRAM_COUNT || "", 10);
          const cacheRoot = path.resolve(path.join(outputDir, "generated-cache"));
          const cachePath = path.resolve(String(generator.cache_path || ""));
          if (generator.ok !== true || generator.mode !== "complete" || !cachePath.startsWith(`${cacheRoot}${path.sep}`)) {
            throw new Error("offline generator did not produce a complete cache artifact inside the bounded directory");
          }

          const envelopeBytes = fs.readFileSync(cachePath);
          const envelope = JSON.parse(envelopeBytes.toString("utf8"));
          const text = String(envelope.text || "");
          const sha256 = (value) => crypto.createHash("sha256").update(value).digest("hex");
          const careerPattern = /https:\/\/fermatmind\.com\/(?:en|zh)\/career\/jobs\/[a-z0-9-]+/g;
          const enneagramPattern = /https:\/\/fermatmind\.com\/(?:en|zh)\/personality\/enneagram[^\s<>)\]]*/g;
          const normalize = (value) => value.replace(/[.,;:!?]+$/g, "");
          const careerCount = new Set((text.match(careerPattern) || []).map(normalize)).size;
          const enneagramCount = new Set((text.match(enneagramPattern) || []).map(normalize)).size;
          if (envelope.siteUrl !== "https://fermatmind.com" || careerCount !== expectedCareer || enneagramCount !== expectedEnneagram) {
            throw new Error("offline artifact cohort counts did not match the dispatch-bound expectations");
          }

          const transferPath = path.join(outputDir, "llms-full-cache-candidate.json");
          fs.copyFileSync(cachePath, transferPath);
          const summary = {
            schema: "fermatmind.llms-full-cache-ops-receipt.v1",
            expected_frontend_sha: process.env.EXPECTED_FRONTEND_SHA,
            generated_at: new Date(Number(envelope.cachedAtMs)).toISOString(),
            envelope_sha256: sha256(envelopeBytes),
            body_sha256: sha256(text),
            bytes: Buffer.byteLength(text, "utf8"),
            career_job_url_count: careerCount,
            enneagram_count: enneagramCount,
          };
          fs.writeFileSync(path.join(outputDir, "offline-artifact-summary.json"), `${JSON.stringify(summary, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `LLMS_FULL_ARTIFACT_PATH=${transferPath}`,
            `LLMS_FULL_ARTIFACT_SHA256=${summary.envelope_sha256}`,
            `LLMS_FULL_BODY_SHA256=${summary.body_sha256}`,
          ].join("\n") + "\n");
          NODE

      - name: Install complete llms-full artifact atomically
        if: env.FEED_PATH == '/llms-full.txt'
        shell: bash
        run: |
          set -euo pipefail
          remote_control_dir="${APP_DIR%/}/.llms-feed-cache-ops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$remote_control_dir" == "${APP_DIR%/}/.llms-feed-cache-ops/"* ]]

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 0700 '$remote_control_dir'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -P "$DEPLOY_PORT" "$LLMS_FULL_ARTIFACT_PATH" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_control_dir/candidate.json"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_FRONTEND_SHA='$EXPECTED_FRONTEND_SHA' APP_DIR='$APP_DIR' ARTIFACT_SHA256='$LLMS_FULL_ARTIFACT_SHA256' REMOTE_CONTROL_DIR='$remote_control_dir' PUBLIC_BASE_URL='$PUBLIC_BASE_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(tr -d '[:space:]' < "$APP_DIR/REVISION")" = "$EXPECTED_FRONTEND_SHA"
          [[ "$REMOTE_CONTROL_DIR" == "${APP_DIR%/}/.llms-feed-cache-ops/"* ]]
          candidate="$REMOTE_CONTROL_DIR/candidate.json"
          test -f "$candidate"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$ARTIFACT_SHA256"

          cache_id="$(PUBLIC_BASE_URL="$PUBLIC_BASE_URL" node <<'NODE'
          const crypto = require("node:crypto");
          const siteUrl = String(process.env.PUBLIC_BASE_URL || "").replace(/\/$/, "");
          process.stdout.write(crypto.createHash("sha256").update(siteUrl).digest("hex").slice(0, 16));
          NODE
          )"
          cache_dir="$(node -e 'process.stdout.write(require("node:path").join(require("node:os").tmpdir(), "fermatmind-llms-full-cache"))')"
          target="$cache_dir/fermatmind-llms-full-response-cache.${cache_id}.v1.json"
          test "$cache_dir" = "/tmp/fermatmind-llms-full-cache"
          test ! -L "$cache_dir"
          install -d -m 0700 "$cache_dir"
          test ! -L "$target"

          if [ -f "$target" ]; then
            install -m 0600 "$target" "$REMOTE_CONTROL_DIR/before.json"
            printf 'present\n' > "$REMOTE_CONTROL_DIR/before-state"
          else
            printf 'absent\n' > "$REMOTE_CONTROL_DIR/before-state"
          fi

          temporary="$(mktemp "$cache_dir/.llms-full-candidate.XXXXXX")"
          trap 'rm -f "$temporary"' EXIT
          install -m 0600 "$candidate" "$temporary"
          test "$(sha256sum "$temporary" | awk '{print $1}')" = "$ARTIFACT_SHA256"
          printf 'pending\n' > "$REMOTE_CONTROL_DIR/mutation-started"
          mv -f "$temporary" "$target"
          trap - EXIT
          printf '%s\n' "$ARTIFACT_SHA256" > "$REMOTE_CONTROL_DIR/installed-sha256"
          REMOTE

      - name: Reload existing PM2 app only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llms-feed-cache-ops"

          ssh_retry() {
            local attempt rc
            for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
              set +e
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -p "$DEPLOY_PORT" "$@"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if [ "$attempt" -eq "$SSH_RETRY_ATTEMPTS" ]; then
                return "$rc"
              fi
              echo "SSH cache-ops attempt $attempt failed; retrying in ${SSH_RETRY_DELAY_SECONDS}s" >&2
              sleep "$SSH_RETRY_DELAY_SECONDS"
            done
          }

          remote_summary="$(
            ssh_retry "$DEPLOY_USER@$DEPLOY_HOST" \
              "EXPECTED_FRONTEND_SHA='$EXPECTED_FRONTEND_SHA' APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          test -d "$APP_DIR"
          cd "$APP_DIR"

          remote_head="$(git rev-parse HEAD 2>/dev/null || true)"
          remote_revision=""
          if [ -f REVISION ]; then
            remote_revision="$(tr -d '[:space:]' < REVISION)"
          fi

          if [ "$remote_head" != "$EXPECTED_FRONTEND_SHA" ] && [ "$remote_revision" != "$EXPECTED_FRONTEND_SHA" ]; then
            echo "remote revision does not match expected frontend SHA" >&2
            exit 1
          fi

          pm2_before="$(
            PM2_JLIST="$(pm2 jlist)" APP_NAME="$APP_NAME" node <<'NODE'
          const rows = JSON.parse(process.env.PM2_JLIST || "[]");
          const appName = process.env.APP_NAME;
          const apps = rows.filter((item) => item && item.name === appName);
          const count = apps.length;
          const online = apps.filter((item) => item?.pm2_env?.status === "online").length;
          if (count < 1 || online !== count) {
            throw new Error(`PM2 app ${appName} is not fully online: count=${count} online=${online}`);
          }
          process.stdout.write(JSON.stringify({ app: appName, count, online }));
          NODE
          )"

          pm2 reload "$APP_NAME" >/dev/null

          pm2_after="$(
            PM2_JLIST="$(pm2 jlist)" APP_NAME="$APP_NAME" node <<'NODE'
          const rows = JSON.parse(process.env.PM2_JLIST || "[]");
          const appName = process.env.APP_NAME;
          const apps = rows.filter((item) => item && item.name === appName);
          const count = apps.length;
          const online = apps.filter((item) => item?.pm2_env?.status === "online").length;
          if (count < 1 || online !== count) {
            throw new Error(`PM2 app ${appName} did not return online: count=${count} online=${online}`);
          }
          process.stdout.write(JSON.stringify({ app: appName, count, online }));
          NODE
          )"

          REMOTE_HEAD="$remote_head" REMOTE_REVISION="$remote_revision" PM2_BEFORE="$pm2_before" PM2_AFTER="$pm2_after" node <<'NODE'
          const summary = {
            remote_head: process.env.REMOTE_HEAD || "",
            remote_revision: process.env.REMOTE_REVISION || "",
            pm2_before: JSON.parse(process.env.PM2_BEFORE || "{}"),
            pm2_after: JSON.parse(process.env.PM2_AFTER || "{}"),
          };
          process.stdout.write(JSON.stringify(summary));
          NODE
          REMOTE
          )"

          printf '%s\n' "$remote_summary" > "$RUNNER_TEMP/llms-feed-cache-ops/remote-summary.json"

      - name: Read back production feeds
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const outputDir = path.join(process.env.RUNNER_TEMP, "llms-feed-cache-ops");
          const remote = JSON.parse(fs.readFileSync(path.join(outputDir, "remote-summary.json"), "utf8"));
          const publicBase = String(process.env.PUBLIC_BASE_URL || "https://fermatmind.com").replace(/\/$/, "");
          const feedPath = process.env.FEED_PATH;
          const expectedCount = Number.parseInt(process.env.EXPECTED_ENNEAGRAM_COUNT || "", 10);
          const expectedCareerCount = Number.parseInt(process.env.EXPECTED_CAREER_JOB_URL_COUNT || "0", 10);
          const expectedMode = process.env.EXPECTED_LLMS_FULL_MODE || "";
          const forbiddenPattern = /(^|\/)(private|result|results|order|orders|payment|payments|token|internal|admin|preview)(\/|$)/i;
          const enneagramUrlPattern = /https:\/\/fermatmind\.com\/(?:en|zh)\/personality\/enneagram[^\s<>)\]]*/g;
          const careerUrlPattern = /https:\/\/fermatmind\.com\/(?:en|zh)\/career\/jobs\/[a-z0-9-]+/g;
          const sha256 = (value) => require("node:crypto").createHash("sha256").update(value).digest("hex");

          function normalizeRawUrl(raw) {
            return raw.replace(/[.,;:!?]+$/g, "");
          }

          function classify(text) {
            const rawMatches = [...text.matchAll(enneagramUrlPattern)].map((match) => normalizeRawUrl(match[0]));
            const careerUrls = new Set(
              [...text.matchAll(careerUrlPattern)].map((match) => normalizeRawUrl(match[0]))
            );
            const countsByUrl = new Map();
            const malformed = [];
            const nonApex = [];
            const forbidden = [];

            for (const raw of rawMatches) {
              countsByUrl.set(raw, (countsByUrl.get(raw) || 0) + 1);
              let parsed;
              try {
                parsed = new URL(raw);
              } catch {
                malformed.push(raw);
                continue;
              }
              if (parsed.origin !== "https://fermatmind.com") {
                nonApex.push(raw);
              }
              if (forbiddenPattern.test(parsed.pathname)) {
                forbidden.push(raw);
              }
            }

            const duplicate = [...countsByUrl.entries()]
              .filter(([, count]) => count > 1)
              .map(([url, count]) => ({ url, count }));

            return {
              unique_canonical_count: countsByUrl.size,
              enneagram_count: countsByUrl.size,
              raw_match_count: rawMatches.length,
              career_job_url_count: careerUrls.size,
              body_sha256: sha256(text),
              duplicate_raw_url_count: duplicate.length,
              duplicate_raw_occurrence_total: duplicate.reduce((total, item) => total + item.count - 1, 0),
              duplicate_count: duplicate.length,
              malformed_count: malformed.length,
              non_apex_count: nonApex.length,
              forbidden_count: forbidden.length,
            };
          }

          async function readFeed(route) {
            const response = await fetch(`${publicBase}${route}`, {
              cache: "no-store",
              headers: { "cache-control": "no-cache" },
            });
            const text = await response.text();
            const headers = {
              cache_control: response.headers.get("cache-control") || "",
              llms_full_mode: response.headers.get("x-fermatmind-llms-full-mode") || "",
              llms_full_source: response.headers.get("x-fermatmind-llms-full-source") || "",
            };
            return {
              path: route,
              status: response.status,
              bytes: text.length,
              headers,
              ...classify(text),
            };
          }

          async function main() {
            const llms = await readFeed("/llms.txt");
            const llmsFull = await readFeed("/llms-full.txt");
            const target = feedPath === "/llms.txt" ? llms : llmsFull;

            const failures = [];
            if (target.status !== 200) failures.push(`${feedPath} returned ${target.status}`);
            if (target.enneagram_count !== expectedCount) {
              failures.push(`${feedPath} Enneagram count ${target.enneagram_count} did not match expected ${expectedCount}`);
            }
            for (const [key, label] of [
              ["malformed_count", "malformed"],
              ["non_apex_count", "non-apex"],
              ["forbidden_count", "forbidden"],
            ]) {
              if (target[key] !== 0) failures.push(`${feedPath} ${label} counter was ${target[key]}`);
            }
            if (feedPath === "/llms.txt" && target.duplicate_raw_url_count !== 0) {
              failures.push(`${feedPath} duplicate counter was ${target.duplicate_raw_url_count}`);
            }
            if (feedPath === "/llms-full.txt" && target.headers.llms_full_mode !== expectedMode) {
              failures.push(`/llms-full.txt mode ${target.headers.llms_full_mode || "(missing)"} did not match ${expectedMode}`);
            }
            if (feedPath === "/llms-full.txt" && target.headers.llms_full_source !== "cache") {
              failures.push(`/llms-full.txt source ${target.headers.llms_full_source || "(missing)"} did not match cache`);
            }
            if (feedPath === "/llms-full.txt" && target.career_job_url_count !== expectedCareerCount) {
              failures.push(`/llms-full.txt Career URL count ${target.career_job_url_count} did not match ${expectedCareerCount}`);
            }
            if (feedPath === "/llms-full.txt" && target.body_sha256 !== process.env.LLMS_FULL_BODY_SHA256) {
              failures.push("/llms-full.txt body SHA-256 did not match the installed offline artifact");
            }

            const summary = {
              checked_at: new Date().toISOString(),
              expected_frontend_sha: process.env.EXPECTED_FRONTEND_SHA,
              remote_head: remote.remote_head,
              remote_revision: remote.remote_revision,
              feed_path: feedPath,
              expected_enneagram_count: expectedCount,
              expected_career_job_url_count: expectedCareerCount,
              expected_llms_full_mode: expectedMode,
              offline_artifact: feedPath === "/llms-full.txt"
                ? JSON.parse(fs.readFileSync(path.join(outputDir, "offline-artifact-summary.json"), "utf8"))
                : null,
              pm2: {
                before: remote.pm2_before,
                after: remote.pm2_after,
              },
              feeds: {
                llms_txt: llms,
                llms_full: llmsFull,
              },
              side_effects: {
                llms_full_cache_artifact_write: feedPath === "/llms-full.txt" ? 1 : 0,
                deploy: 0,
                git_pull: 0,
                git_reset: 0,
                cms: 0,
                search_queue: 0,
                indexnow: 0,
                secrets_or_permissions_mutation: 0,
              },
              failures,
              result: failures.length === 0 ? "PASS" : "FAIL",
            };

            fs.writeFileSync(path.join(outputDir, "llms-feed-cache-ops-summary.json"), `${JSON.stringify(summary, null, 2)}\n`);
            fs.writeFileSync(path.join(outputDir, "llms-feed-cache-ops-summary.md"), [
              "# LLMS Feed Cache Ops Summary",
              "",
              `- Result: ${summary.result}`,
              `- Checked at: ${summary.checked_at}`,
              `- Feed path: ${summary.feed_path}`,
              `- Expected frontend SHA: ${summary.expected_frontend_sha}`,
              `- Remote HEAD: ${summary.remote_head}`,
              `- PM2 online after reload: ${summary.pm2.after.online}/${summary.pm2.after.count}`,
              `- /llms.txt Enneagram: ${llms.enneagram_count}`,
              `- /llms-full.txt Enneagram: ${llmsFull.enneagram_count}`,
              `- /llms-full.txt Career URLs: ${llmsFull.career_job_url_count}`,
              `- /llms-full.txt mode: ${llmsFull.headers.llms_full_mode || "(missing)"}`,
              `- /llms-full.txt source: ${llmsFull.headers.llms_full_source || "(missing)"}`,
              `- Target duplicate advisory/private/malformed/non-apex counters: ${target.duplicate_raw_url_count}/${target.forbidden_count}/${target.malformed_count}/${target.non_apex_count}`,
              `- llms-full cache artifact writes: ${summary.side_effects.llms_full_cache_artifact_write}`,
              `- Side effects: deploy=0, git_pull=0, git_reset=0, CMS=0, Search Queue=0, IndexNow=0, secrets/permissions mutation=0`,
              "",
              failures.length ? `Failures:\n${failures.map((item) => `- ${item}`).join("\n")}` : "No failures.",
              "",
            ].join("\n"));

            if (failures.length > 0) {
              console.error(failures.join("\n"));
              process.exit(1);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Roll back llms-full artifact after failed install or readback
        if: failure() && env.FEED_PATH == '/llms-full.txt'
        shell: bash
        run: |
          set -euo pipefail
          remote_control_dir="${APP_DIR%/}/.llms-feed-cache-ops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$remote_control_dir" == "${APP_DIR%/}/.llms-feed-cache-ops/"* ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_FRONTEND_SHA='$EXPECTED_FRONTEND_SHA' APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' REMOTE_CONTROL_DIR='$remote_control_dir' PUBLIC_BASE_URL='$PUBLIC_BASE_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(tr -d '[:space:]' < "$APP_DIR/REVISION")" = "$EXPECTED_FRONTEND_SHA"
          [[ "$REMOTE_CONTROL_DIR" == "${APP_DIR%/}/.llms-feed-cache-ops/"* ]]
          if [ ! -f "$REMOTE_CONTROL_DIR/mutation-started" ]; then
            exit 0
          fi

          cache_id="$(PUBLIC_BASE_URL="$PUBLIC_BASE_URL" node <<'NODE'
          const crypto = require("node:crypto");
          const siteUrl = String(process.env.PUBLIC_BASE_URL || "").replace(/\/$/, "");
          process.stdout.write(crypto.createHash("sha256").update(siteUrl).digest("hex").slice(0, 16));
          NODE
          )"
          cache_dir="$(node -e 'process.stdout.write(require("node:path").join(require("node:os").tmpdir(), "fermatmind-llms-full-cache"))')"
          target="$cache_dir/fermatmind-llms-full-response-cache.${cache_id}.v1.json"
          test "$cache_dir" = "/tmp/fermatmind-llms-full-cache"
          state="$(tr -d '[:space:]' < "$REMOTE_CONTROL_DIR/before-state")"
          case "$state" in
            present)
              test -f "$REMOTE_CONTROL_DIR/before.json"
              temporary="$(mktemp "$cache_dir/.llms-full-rollback.XXXXXX")"
              trap 'rm -f "$temporary"' EXIT
              install -m 0600 "$REMOTE_CONTROL_DIR/before.json" "$temporary"
              mv -f "$temporary" "$target"
              trap - EXIT
              ;;
            absent)
              rm -f -- "$target"
              ;;
            *)
              echo "invalid llms-full rollback state" >&2
              exit 1
              ;;
          esac
          pm2 reload "$APP_NAME" >/dev/null
          REMOTE

      - name: Clean up remote llms-full control directory
        if: always() && env.FEED_PATH == '/llms-full.txt'
        shell: bash
        run: |
          set -euo pipefail
          remote_control_dir="${APP_DIR%/}/.llms-feed-cache-ops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$remote_control_dir" == "${APP_DIR%/}/.llms-feed-cache-ops/"* ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_CONTROL_DIR='$remote_control_dir' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$REMOTE_CONTROL_DIR" == "${APP_DIR%/}/.llms-feed-cache-ops/"* ]]
          rm -rf -- "$REMOTE_CONTROL_DIR"
          REMOTE

      - name: Upload cache ops summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llms-feed-cache-ops-summary
          path: |
            ${{ runner.temp }}/llms-feed-cache-ops/llms-feed-cache-ops-summary.json
            ${{ runner.temp }}/llms-feed-cache-ops/llms-feed-cache-ops-summary.md
            ${{ runner.temp }}/llms-feed-cache-ops/offline-artifact-summary.json
          if-no-files-found: error
