# Included only by the staging HTTP vhost after SHA-bound installation.
location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type "text/plain";
    root /var/www/letsencrypt;
}

# Keep the redirect in a location block. A server-level return runs before
# location selection and would redirect ACME challenges as well.
location / {
    return 301 https://$host$request_uri;
}
