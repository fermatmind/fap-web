# Canonical FermatMind public web ingress for the Node1 1Panel OpenResty
# container. This file is installed only by the SHA-bound production workflow.

# A transient asset error must not become a year-long browser cache entry.
map $status $fermatmind_static_cache_control {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}

map $uri $history_avatar_max_age {
  default "public, max-age=86400";
  "~^/images/global-history/[a-f0-9]{64}/[a-z0-9-]+[.]jpg$" "public, max-age=31536000, immutable";
}

map $status $history_avatar_cache_control {
  default "no-store";
  200 $history_avatar_max_age;
  206 $history_avatar_max_age;
  304 $history_avatar_max_age;
}

map $arg_portrait $history_preview_file {
  default "";
  "~^[a-z0-9][a-z0-9-]{0,79}$" /images/global-history/$arg_portrait.jpg;
}

limit_req_zone $binary_remote_addr zone=fermatmind_fun_og_ip:10m rate=8r/s;
limit_conn_zone $server_name zone=fermatmind_fun_og_total:1m;

server {
  listen 80;
  server_name fermatmind.com www.fermatmind.com;

  location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type "text/plain";
    # /www is a host-mounted persistent volume. Certbot on the host writes to
    # /opt/fermatmind/openresty/www/acme, which is visible here as /www/acme.
    root /www/acme;
  }

  location = /healthz {
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name fermatmind.com www.fermatmind.com;

  ssl_certificate /www/sites/fermatmind.com/ssl/fullchain.pem;
  ssl_certificate_key /www/sites/fermatmind.com/ssl/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location = /healthz {
    return 200 "ok\n";
  }

  location ^~ /share/ {
    root /usr/share/nginx/html;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    expires 1h;
  }

  location ^~ /images/global-history/ {
    root /www/history-assets/current;
    try_files $uri =404;
    open_file_cache max=2048 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $history_avatar_cache_control always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  # The existing public OG URL now serves a portrait preview for every query
  # variant. The anonymous route never opens an upstream connection.
  location = /og/fun/global-history-quiz {
    root /www/history-assets/current;
    if ($history_preview_file = "") { return 404; }
    try_files $history_preview_file =404;
    types { image/jpeg jpg; }
    default_type image/jpeg;
    open_file_cache max=1024 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $history_avatar_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nocache" always;
  }

  # Remaining dynamic entertainment artwork has its own budget.
  location ^~ /og/fun/ {
    limit_req zone=fermatmind_fun_og_ip burst=12 nodelay;
    limit_req_status 429;
    limit_conn fermatmind_fun_og_total 16;
    limit_conn_status 429;
    proxy_cache off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Proxy-Cache BYPASS always;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  # Content-hashed Next.js assets are the only proxied surface allowed to use
  # the public microcache. Nonce-bearing HTML must never enter this location.
  location ^~ /_next/static/ {
    proxy_cache fermatmind_public;
    proxy_cache_key "$scheme$host$uri";
    proxy_cache_valid 200 365d;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $fermatmind_static_cache_control always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
  }

  location = /favicon.ico {
    proxy_cache fermatmind_public;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 30m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=1800, stale-while-revalidate=3600" always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js emits a per-request CSP nonce and private/no-store cache headers
  # for HTML. Preserve those upstream headers and bypass the proxy cache for
  # every non-static route, including /, localized pages, API proxies,
  # sitemap.xml, llms.txt, llms-full.txt and /revision.
  location / {
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Proxy-Cache BYPASS always;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
  }
}
